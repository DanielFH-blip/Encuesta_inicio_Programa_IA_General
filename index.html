<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuéntanos tu caso · IA para el trabajo de todos los días · Vectiva Consulting</title>
<meta name="description" content="Antes del Laboratorio, recorremos las cuatro capacidades del programa sobre tu trabajo real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#030407; --steel:#0C0F16; --steel-2:#141821;
  --acid:#0052FF; --acid-dim:rgba(0,82,255,0.10);
  --cyan:#00C3FF; --cream:#F0F2F5; --muted:#9BA8BA; --muted-2:#6B7A90;
  --border:rgba(255,255,255,0.08); --border-a:rgba(255,255,255,0.2);
  --wash:rgba(255,255,255,0.032); --wash-2:rgba(255,255,255,0.055);
  --fd:'Bebas Neue',sans-serif; --fb:'DM Sans',sans-serif; --fm:'JetBrains Mono',monospace;
  --pad:clamp(20px,5vw,58px);
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#F6F4EF; --steel:#FCFBF8; --steel-2:#EFECE4;
    --cream:#121110; --muted:#5C5854; --muted-2:#7A756F;
    --border:rgba(0,0,0,0.08); --border-a:rgba(0,82,255,0.3);
    --wash:rgba(0,0,0,0.028); --wash-2:rgba(0,82,255,0.045);
    --acid-dim:rgba(0,82,255,0.06);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--fb);background:var(--ink);color:var(--cream);
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100svh;
}
body::after{
  content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.022'/%3E%3C/svg%3E");
}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- marco de expediente ---------- */
.mark{position:fixed;width:34px;height:34px;z-index:60;pointer-events:none}
.mark.tl{top:74px;left:var(--pad);border-top:1px solid var(--cyan);border-left:1px solid var(--cyan);
  border-top-left-radius:34px;opacity:.85}
.mark.br{bottom:32px;right:var(--pad);border-bottom:1px solid var(--border-a);border-right:1px solid var(--border-a);
  border-bottom-right-radius:34px}
@media (max-width:700px){.mark{display:none}}

/* ---------- cabecera ---------- */
.top{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px var(--pad);background:linear-gradient(180deg,var(--ink) 62%,transparent);
}
.n-logo{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.n-logo-text{display:flex;flex-direction:column}
.n-logo-main,.n-logo-sub{font-family:var(--fb);text-transform:uppercase;line-height:1;color:var(--cream)}
.n-logo-main{font-weight:800;font-size:.92rem;letter-spacing:.15em}
.n-logo-sub{font-weight:500;font-size:.46rem;letter-spacing:.25em;margin-top:3px}
.n-dot{width:6px;height:6px;background:#00C3FF;border-radius:50%;box-shadow:0 0 8px #00C3FF}
.meter{display:flex;align-items:center;gap:10px}
.meter-t{font-family:var(--fm);font-size:.62rem;color:var(--muted-2)}
.meter-b{width:96px;height:1px;background:var(--border);position:relative;overflow:hidden}
.meter-b i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--acid),var(--cyan));
  transition:width .6s cubic-bezier(.16,.8,.3,1)}
@media (max-width:560px){.meter-b{width:62px}}

/* ---------- escenario ---------- */
main{min-height:100svh;display:flex;align-items:center;padding:96px var(--pad) 64px}
.stage{width:100%;max-width:1080px;margin:0 auto}
.scr{display:none}
.scr.on{display:block}

/* rejilla asimétrica de pregunta */
.grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.grid>div:last-child{max-width:640px}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:22px}}

.side{position:relative;padding-top:6px}
.side-n{font-family:var(--fd);font-size:3.4rem;line-height:.8;color:var(--acid)}
.side-v{font-family:var(--fm);font-size:.64rem;color:var(--muted-2);margin-top:10px;line-height:1.5}
.side-rule{margin-top:18px;width:1px;height:64px;background:linear-gradient(180deg,var(--acid),transparent);opacity:.7}
@media (max-width:820px){
  .side{display:flex;align-items:baseline;gap:12px;padding-top:0}
  .side-n{font-size:2.1rem}
  .side-v{margin-top:0}
  .side-rule{display:none}
}

/* ---------- tipografía ---------- */
.rev{animation:rev .72s cubic-bezier(.16,.85,.3,1) both}
@keyframes rev{from{opacity:0;transform:translateY(16px);clip-path:inset(0 0 100% 0)}
               to{opacity:1;transform:none;clip-path:inset(0 0 -10% 0)}}
.d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}.d4{animation-delay:.32s}.d5{animation-delay:.42s}

.eye{font-family:var(--fm);font-size:.66rem;color:var(--cyan);margin-bottom:18px}
h1{font-family:var(--fd);font-size:clamp(3.4rem,10.5vw,7rem);line-height:.86;font-weight:400}
h1 em{font-style:normal;color:var(--acid);display:block}
.lede{color:var(--muted);font-size:1.05rem;max-width:52ch;margin-top:26px}
.lede+.lede{margin-top:14px}
.lede b{color:var(--cream);font-weight:500}

.ask{font-size:clamp(1.5rem,3.5vw,2.05rem);font-weight:500;line-height:1.24;letter-spacing:-.022em;max-width:23ch}
.help{color:var(--muted);font-size:.95rem;margin-top:16px;max-width:46ch}

/* ---------- capítulo ---------- */
.cap-eye{font-family:var(--fm);font-size:.66rem;color:var(--muted-2);margin-bottom:14px}
.cap-v{font-family:var(--fd);font-size:clamp(4.4rem,15vw,10rem);line-height:.8;color:var(--cream)}
.cap-line{height:1px;width:100%;max-width:560px;margin:30px 0 24px 0;
  background:linear-gradient(90deg,var(--acid),var(--cyan),transparent);
  transform-origin:left;animation:draw .95s cubic-bezier(.16,.85,.3,1) both;animation-delay:.3s}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cap-d{font-size:1.12rem;color:var(--muted);max-width:44ch;padding-left:clamp(0px,3vw,44px)}
.cap-d b{color:var(--cream);font-weight:500}
.cap-s{font-family:var(--fm);font-size:.64rem;color:var(--muted-2);margin-top:22px;padding-left:clamp(0px,3vw,44px)}

/* ---------- campos ---------- */
.field{margin-top:26px;position:relative}
label.lbl{display:block;font-size:.86rem;font-weight:500;color:var(--muted);margin-bottom:10px}
input[type=text],textarea{
  width:100%;background:var(--wash);color:var(--cream);
  border:none;border-bottom:1px solid var(--border);border-radius:0;
  padding:14px 16px;font-family:var(--fb);line-height:1.6;
  transition:background .25s,border-color .3s;
}
input[type=text]:focus,textarea:focus{background:var(--wash-2)}
input[type=text]{font-size:1.05rem}
textarea{min-height:112px;resize:none;overflow:hidden;font-size:1.14rem;line-height:1.66}
input::placeholder,textarea::placeholder{color:var(--muted-2);opacity:.72}
input:focus,textarea:focus{outline:none}
.field::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:linear-gradient(90deg,var(--acid),var(--cyan));transition:width .5s cubic-bezier(.16,.8,.3,1)}
.field.act::after{width:100%}
.two{display:grid;grid-template-columns:1fr;gap:26px}

/* ---------- micrófono ---------- */
.mrow{display:flex;align-items:center;gap:13px;margin-top:13px;flex-wrap:wrap}
.mrow[hidden]{display:none}
.mic{display:inline-flex;align-items:center;gap:9px;background:transparent;color:var(--muted);
  border:1px solid var(--border);border-radius:40px;padding:8px 15px;font-size:.84rem;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s}
.mic:hover{color:var(--cream);border-color:var(--border-a)}
.mic.on{background:var(--acid);border-color:var(--acid);color:#fff}
.mic svg{width:14px;height:14px}
.pips{display:flex;align-items:center;gap:4px;height:15px}
.pips i{width:3px;height:3px;background:var(--cyan);border-radius:1px;animation:bip 1.1s ease-in-out infinite}
.pips i:nth-child(2){animation-delay:.1s}.pips i:nth-child(3){animation-delay:.2s}
.pips i:nth-child(4){animation-delay:.3s}.pips i:nth-child(5){animation-delay:.4s}
@keyframes bip{0%,100%{height:3px}50%{height:13px}}
.pips[hidden]{display:none}
.say{font-size:.78rem;color:var(--muted-2)}
.say.warn{color:var(--acid)}
.heard{margin-top:9px;font-size:.9rem;color:var(--muted-2);font-style:italic}
.heard:empty{display:none}

/* ---------- acciones ---------- */
.act{margin-top:36px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--acid);color:#fff;
  border:1px solid var(--acid);border-radius:2px;padding:15px 27px;font-family:var(--fd);
  font-size:1.16rem;letter-spacing:.06em;cursor:pointer;transition:filter .2s,transform .14s}
.btn:hover{filter:brightness(1.14)}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.back{background:none;border:none;color:var(--muted-2);font-size:.86rem;cursor:pointer;transition:color .2s}
.back:hover{color:var(--cream)}
.msg{margin-top:14px;font-size:.9rem;color:var(--acid)}
.tiny{margin-top:16px;font-size:.78rem;color:var(--muted-2)}

/* ---------- cierre ---------- */
.verbs{margin-top:32px;border-top:1px solid var(--border);max-width:640px}
.verb{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.verb-n{font-family:var(--fm);font-size:.6rem;color:var(--muted-2);width:20px;flex:none}
.verb-b{flex:1;min-width:0}
.verb-b h4{font-family:var(--fd);font-size:1.36rem;font-weight:400;letter-spacing:.04em;line-height:1;color:var(--muted-2)}
.verb-b p{font-size:.83rem;color:var(--muted-2);margin-top:3px}
.verb-s{font-family:var(--fm);font-size:.58rem;padding:4px 9px;border-radius:2px;flex:none;
  background:var(--steel);color:var(--muted-2);border:1px solid var(--border)}
.verb.fed h4{color:var(--cream)}
.verb.fed .verb-s{background:var(--acid-dim);color:var(--cyan);border-color:var(--acid)}
details{margin-top:30px;max-width:640px}
summary{cursor:pointer;font-size:.82rem;color:var(--muted-2);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";font-family:var(--fm)}
details[open] summary::before{content:"– "}
pre{background:var(--steel);border:1px solid var(--border);border-radius:2px;padding:16px;overflow:auto;
  font-family:var(--fm);font-size:.7rem;line-height:1.6;color:var(--muted);max-height:250px;margin-top:12px}
</style>
</head>
<body>

<span class="mark tl"></span><span class="mark br"></span>

<header class="top">
  <a href="#" class="n-logo" aria-label="Vectiva Consulting">
    <div class="n-logo-text"><span class="n-logo-main">VECTIVA</span><span class="n-logo-sub">CONSULTING</span></div>
    <span class="n-dot"></span>
  </a>
  <div class="meter" id="meter" hidden>
    <span class="meter-t" id="meterT">01 / 07</span>
    <span class="meter-b"><i id="meterI"></i></span>
  </div>
</header>

<main><div class="stage" id="stage"></div></main>

<script>
/* ======================= configuración ======================= */
/* URL del despliegue de Apps Script (termina en /exec).
   Vacía = el formulario funciona completo pero no envía. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyCXuKmlZhx94cfYNpnTJqI8txEp_H0A1qfWMj4AlXXiuVPvmPDev8KCCdKFKAINnYf/exec";

/* ======================= guion ======================= */
const CAPS = {
  pedir:   { n:'01', v:'Pedir',    s:'sesión 01',
             d:'Dejar de hacerle preguntas sueltas y <b>encargarle trabajo completo</b>, con un espacio que no arranca de cero cada mañana.' },
  averiguar:{ n:'02', v:'Averiguar', s:'sesión 02',
             d:'Que <b>lea tus propios documentos</b>, que salga a buscar lo que no tienes, y que diga de dónde sacó cada cosa.' },
  dudar:   { n:'03', v:'Dudar',    s:'sesión 03',
             d:'Ponerla a <b>llevarte la contraria</b> antes de que decidas, y que lo que salga de ahí se pueda presentar.' },
  delegar: { n:'04', v:'Delegar',  s:'sesión 04',
             d:'Armar algo que <b>trabaje solo</b>, y tener claro hasta dónde se le suelta la mano.' }
};

/* tipo: cover | ident | cap | ask | end */
const FLOW = [
  { t:'cover' },
  { t:'ident' },

  { t:'ask', k:'cuello', n:'01', v:'tu trabajo\nhoy',
    q:'¿Qué es lo que más tiempo te consume hoy, y sientes que no debería?',
    h:'Algo concreto de las últimas semanas, no un problema general del área. Si se te vienen varias cosas, quédate con la que más te pesó.',
    p:'El informe mensual para el comité. Me toma casi tres horas y la mitad es copiar y pegar...' },

  { t:'ask', k:'mejora', n:'02', v:'tu trabajo\nhoy',
    q:'¿Qué parte de tu trabajo crees que podría hacerse mucho mejor de como se hace hoy?',
    h:'No hace falta que sepas cómo. Solo dónde. Puede ser algo que se demora, algo que se equivoca seguido, o algo que nunca alcanzas a hacer bien.',
    p:'El seguimiento a proveedores. Se hace por correo y nadie tiene la foto completa...' },

  { t:'cap', c:'pedir' },
  { t:'ask', k:'pedir', n:'03', v:'pedir',
    q:'¿Qué tarea tuya te gustaría poder encargar completa, en vez de ir pidiendo pedacito por pedacito?',
    h:'Piensa en algo que hoy le explicarías a alguien por partes porque no confías en soltarlo entero.',
    p:'Armar el borrador del informe con los datos del mes, no solo redactar un párrafo suelto...' },

  { t:'cap', c:'averiguar' },
  { t:'ask', k:'averiguar', n:'04', v:'averiguar',
    q:'¿Qué te toca leer, buscar o cruzar antes de poder decidir o entregar algo?',
    h:'Cuéntanos qué tipo de documento es, de dónde sale y en qué formato llega. No nos mandes archivos, solo descríbelos.',
    p:'Actas de comité en PDF, un Excel de financiera y normativa que está en la intranet...' },

  { t:'cap', c:'dudar' },
  { t:'ask', k:'dudar', n:'05', v:'dudar',
    q:'¿Qué entrega o decisión importante tuya o de tu área debería pasar por una revisión más rigurosa antes de salir?',
    h:'Cuéntanos quién la revisa hoy y qué pasa si se va con un error. Eso nos dice cuánta verificación hay que montarle encima.',
    p:'El concepto que va a junta. Si una cifra está mala, se toma una decisión sobre un dato falso...' },

  { t:'cap', c:'delegar' },
  { t:'ask', k:'delegar', n:'06', v:'delegar',
    q:'¿Qué parte de tu trabajo se repite lo suficiente como para dejarla corriendo sola, y qué te daría miedo soltar?',
    h:'Las dos mitades importan. Lo que se repite nos dice qué construir, y lo que te da miedo soltar nos dice dónde ponerle los frenos.',
    p:'La consolidación de datos se repite igual todos los meses. Lo que no soltaría es la interpretación...' },

  { t:'ask', k:'extra', n:'07', v:'para\ncerrar',
    q:'¿Algo más que quieras contarnos?',
    h:'Una preocupación, algo que te gustaría lograr, o algo que no encajaba en las preguntas anteriores.',
    p:'Opcional, pero acá suelen salir las mejores ideas.' },

  { t:'end' }
];

const VERBS=[
 {n:'01',v:'Pedir',d:'Encargarle trabajo completo, no preguntas sueltas.',ks:['pedir']},
 {n:'02',v:'Averiguar',d:'Que lea lo tuyo y traiga lo de afuera con fuente.',ks:['averiguar']},
 {n:'03',v:'Dudar',d:'Ponerla a llevarte la contraria antes de decidir.',ks:['dudar']},
 {n:'04',v:'Delegar',d:'Armar algo que trabaje solo, con frenos.',ks:['delegar']}
];

const ASKS = FLOW.filter(s=>s.t==='ask');

/* ======================= entorno ======================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_SAFARI=/^((?!chrome|android|crios|edg).)*safari/i.test(navigator.userAgent);
const CAN=!!SR&&window.isSecureContext;

/* ======================= estado ======================= */
const KEY='vectiva_caso_v3';
let data={};
try{ data=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
let i=0;

const stage=document.getElementById('stage');
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
const micIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

function micBlock(k){
  if(!CAN) return '';
  return `<div class="mrow" id="m_${k}">
    <button class="mic" type="button" id="b_${k}">${micIco}<span id="l_${k}">Hablar en vez de escribir</span></button>
    <span class="pips" id="p_${k}" hidden><i></i><i></i><i></i><i></i><i></i></span>
    <span class="say" id="s_${k}"></span></div>`;
}

/* ======================= pintar ======================= */
function render(){
  const s=FLOW[i];
  stopRec();
  let html='';

  if(s.t==='cover'){
    html=`<div class="scr on">
      <div class="eye rev d1">Antes de la sesión 01</div>
      <h1 class="rev d2">Cuéntanos<em>tu caso</em></h1>
      <p class="lede rev d3">Vamos a recorrer las cuatro capacidades que vas a aprender, una por una, y en cada una te preguntamos dónde encaja en tu trabajo.</p>
      <p class="lede rev d4">Siete preguntas, sin límite de extensión. <b>Lo que nos cuentes es el material con el que armamos tus ejercicios.</b>${CAN?'':' Para responder hablando, abre este enlace en Chrome desde un computador.'}</p>
      <div class="act rev d5">
        <button class="btn" onclick="next()">Empezar ${arrow}</button>
        ${Object.keys(data).length?'<button class="back" onclick="wipe()">Borrar lo que tenía guardado</button>':''}
      </div></div>`;
  }

  else if(s.t==='ident'){
    html=`<div class="scr on"><div class="grid">
      <div class="side rev d1"><div class="side-n">00</div><div class="side-v">para<br>conocerte</div><div class="side-rule"></div></div>
      <div>
        <h2 class="ask rev d2">Antes de tu caso, cuéntanos quién eres.</h2>
        <p class="help rev d3">Preparar un ejercicio para alguien de operaciones no se parece en nada a prepararlo para alguien de gestión humana, y queremos acertar.</p>
        <div class="rev d4">
          <div class="field two">
            <div><label class="lbl" for="nombre">Tu nombre completo</label><input type="text" id="nombre" data-k="nombre" placeholder="Nombre y apellido"></div>
            <div><label class="lbl" for="cargo">Tu cargo</label><input type="text" id="cargo" data-k="cargo" placeholder="Por ejemplo: Directora de Operaciones"></div>
          </div>
          <div class="field" id="f_funcion">
            <label class="lbl" for="t_funcion">¿De qué eres responsable en el día a día?</label>
            <textarea id="t_funcion" data-k="funcion" placeholder="Qué está a tu cargo, con quién trabajas, qué decisiones pasan por ti."></textarea>
            <div class="heard" id="h_funcion"></div>
          </div>
          ${micBlock('funcion')}
        </div>
        <div class="act rev d5">
          <button class="btn" onclick="next()">Seguir ${arrow}</button>
          <button class="back" onclick="prev()">Atrás</button>
        </div>
        <p class="msg" id="msg"></p>
      </div></div></div>`;
  }

  else if(s.t==='cap'){
    const c=CAPS[s.c];
    html=`<div class="scr on">
      <div class="cap-eye rev d1">${c.s} · capacidad ${c.n} de 04</div>
      <div class="cap-v rev d2">${c.v}</div>
      <div class="cap-line"></div>
      <p class="cap-d rev d3">${c.d}</p>
      <p class="cap-s rev d4">La siguiente pregunta es sobre dónde encaja esto en lo que tú haces.</p>
      <div class="act rev d5">
        <button class="btn" onclick="next()">Continuar ${arrow}</button>
        <button class="back" onclick="prev()">Atrás</button>
      </div></div>`;
  }

  else if(s.t==='ask'){
    html=`<div class="scr on"><div class="grid">
      <div class="side rev d1"><div class="side-n">${s.n}</div><div class="side-v">${s.v.replace(/\n/g,'<br>')}</div><div class="side-rule"></div></div>
      <div>
        <h2 class="ask rev d2">${s.q}</h2>
        <p class="help rev d3">${s.h}</p>
        <div class="rev d4">
          <div class="field" id="f_${s.k}">
            <textarea id="t_${s.k}" data-k="${s.k}" placeholder="${s.p}" aria-label="Pregunta ${s.n}"></textarea>
            <div class="heard" id="h_${s.k}"></div>
          </div>
          ${micBlock(s.k)}
        </div>
        <div class="act rev d5">
          <button class="btn" onclick="next()">${i===FLOW.length-2?'Enviar mi caso':'Seguir'} ${arrow}</button>
          <button class="back" onclick="prev()">Atrás</button>
        </div>
        <p class="msg" id="msg"></p>
      </div></div></div>`;
  }

  else if(s.t==='end'){
    const nom=(data.nombre||'').trim().split(' ')[0];
    const fed=v=>v.ks.some(k=>(data[k]||'').trim().length>25);
    const faltan=VERBS.filter(v=>!fed(v)).length;
    html=`<div class="scr on">
      <div class="eye rev d1">Recibido</div>
      <h1 class="rev d2">Gracias<em>${nom||'de verdad'}</em></h1>
      <p class="lede rev d3">Lo que nos contaste no se va a una carpeta. Se convierte en el ejercicio que vas a trabajar en las sesiones, y lo vas a reconocer apenas lo veas en pantalla.</p>
      <div class="verbs rev d4">${VERBS.map(v=>`
        <div class="verb ${fed(v)?'fed':''}">
          <span class="verb-n">${v.n}</span>
          <span class="verb-b"><h4>${v.v}</h4><p>${v.d}</p></span>
          <span class="verb-s">${fed(v)?'con tu material':'sin material'}</span></div>`).join('')}</div>
      <p class="tiny rev d5">${faltan?'Las sesiones sin material se van a trabajar con un caso general.':'Las cuatro sesiones quedan con material tuyo. Nos vemos en la sesión 1.'}</p>
      <details><summary>Ver lo que enviaste</summary><pre id="out"></pre></details>
    </div>`;
  }

  stage.innerHTML=html;

  /* enganches */
  stage.querySelectorAll('textarea,input[type=text]').forEach(el=>{
    const k=el.dataset.k;
    if(data[k]) el.value=data[k];
    if(el.tagName==='TEXTAREA') grow(el);
    el.addEventListener('input',()=>{ if(el.tagName==='TEXTAREA') grow(el); data[k]=el.value; store(); });
    el.addEventListener('focus',()=> el.closest('.field')?.classList.add('act'));
    el.addEventListener('blur',()=> el.closest('.field')?.classList.remove('act'));
  });
  if(CAN){
    stage.querySelectorAll('.mic').forEach(b=> b.addEventListener('click',()=> toggle(b.id.slice(2))));
  }
  /* al presionar un botón el campo pierde el foco, el bloque se reacomoda y el botón
     se mueve antes de soltar, de modo que el clic nunca se dispara. Se evita el blur. */
  stage.querySelectorAll('.btn,.back,.mic').forEach(b=>
    b.addEventListener('mousedown',e=>e.preventDefault()));
  const ta=stage.querySelector('textarea');
  if(ta && s.t!=='cover') setTimeout(()=>ta.focus(),480);

  /* medidor */
  const m=document.getElementById('meter');
  const idx=ASKS.findIndex(a=>a.k===s.k);
  if(s.t==='ask'){
    m.hidden=false;
    document.getElementById('meterT').textContent=String(idx+1).padStart(2,'0')+' / '+String(ASKS.length).padStart(2,'0');
    document.getElementById('meterI').style.width=((idx+1)/ASKS.length*100)+'%';
  } else if(s.t==='end'){
    m.hidden=false;
    document.getElementById('meterT').textContent='completo';
    document.getElementById('meterI').style.width='100%';
  } else m.hidden=true;

  if(s.t==='end') finish();
  window.scrollTo({top:0,behavior:'instant'});
}

function grow(t){ t.style.height='auto'; t.style.height=Math.max(112,t.scrollHeight)+'px'; }
function store(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }

/* ======================= navegación ======================= */
function next(){
  const s=FLOW[i];
  if(s.t==='ident'){
    const nm=(data.nombre||'').trim();
    if(!nm){ warn('Nos falta tu nombre para saber de quién es el caso.'); document.getElementById('nombre').focus(); return; }
    if(nm.split(/\s+/).length<2){ warn('Escríbenos tu nombre y tu apellido, así te identificamos en la lista.'); document.getElementById('nombre').focus(); return; }
  }
  if(s.t==='ask' && s.k==='cuello' && (data.cuello||'').trim().length<15){
    warn('Cuéntanos aunque sea en una frase qué te está consumiendo el tiempo.'); return;
  }
  if(i===FLOW.length-2){ send(); return; }
  i++; render();
}
function prev(){ if(i>0){ i--; render(); } }
function warn(t){ const m=document.getElementById('msg'); if(m) m.textContent=t; }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} data={}; i=0; render(); }

/* ======================= dictado ======================= */
let rec=null,cur=null,on=false,t0=0,flaps=0,pend='',arranco=false;
function volcar(ta,k,txt){
  const t=String(txt||'').trim(); if(!t) return;
  ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + t;
  grow(ta); data[k]=ta.value; store();
}
function toggle(k){ if(on&&cur===k){ stopRec(); return; } stopRec(); startRec(k); }
/* rec.start() va sincrónico dentro del clic: un await previo consume el gesto */
function startRec(k){
  if(!CAN) return;
  rec=new SR(); rec.lang='es-CO'; rec.continuous=!IS_SAFARI; rec.interimResults=true;
  cur=k; on=true; flaps=0; pend=''; arranco=false;
  const ta=document.getElementById('t_'+k), hd=document.getElementById('h_'+k);
  if(!ta) return;
  rec.onresult=e=>{
    let itm='';
    for(let n=e.resultIndex;n<e.results.length;n++){
      const t=e.results[n][0].transcript;
      if(e.results[n].isFinal){ volcar(ta,k,t); pend=''; }
      else itm+=t;
    }
    pend=itm;
    if(hd) hd.textContent=itm;
    if(itm||!pend) say(k,'te escuchamos');
  };
  rec.onerror=e=>{
    if(e.error==='no-speech') return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      on=false; ui(k,false); say(k,'Falta el permiso del micrófono. Actívalo en el candado de la barra.',1);
    } else if(e.error==='network'){
      on=false; ui(k,false); say(k,'Este navegador no puede dictar. Escribe tu respuesta.',1);
    } else say(k,'Se interrumpió. Toca de nuevo para seguir.',1);
  };
  rec.onend=()=>{
    if(pend){ volcar(ta,k,pend); pend=''; }   // nada de lo dicho se pierde
    if(hd) hd.textContent='';
    if(!on||cur!==k){ ui(k,false); return; }
    if(IS_SAFARI){ on=false; ui(k,false);
      say(k, ta.value.trim()? 'En pausa. Toca de nuevo para seguir.' : 'No se captó nada. Revisa el permiso del micrófono.', !ta.value.trim());
      return; }
    if(Date.now()-t0<400){ if(++flaps>=3){ on=false; ui(k,false); say(k,'El dictado no arrancó acá. Escribe tu respuesta.',1); return; } }
    else flaps=0;
    say(k,'reconectando');
    try{ t0=Date.now(); rec.start(); setTimeout(()=>on&&say(k,'te escuchamos'),400); }
    catch(err){ on=false; ui(k,false); }
  };
  rec.onstart=()=>{ arranco=true; say(k,'te escuchamos'); };
  try{ t0=Date.now(); rec.start(); }catch(err){ say(k,'Toca de nuevo.',1); return; }
  ui(k,true); say(k,'conectando...');
  setTimeout(()=>{ if(on&&cur===k&&!arranco) say(k,'El micrófono no respondió. Revisa el permiso en el candado de la barra.',1); },2500);
}
function stopRec(){
  on=false;
  /* el volcado va ANTES de soltar el reconocimiento y de forma sincrónica:
     si vive dentro de onend, al presionar Detener se pierde lo provisional.
     Se anula onresult para que un resultado tardío no duplique el texto. */
  if(pend && cur){
    const t=document.getElementById('t_'+cur);
    if(t) volcar(t,cur,pend);
    else { data[cur]=((data[cur]||'')+' '+pend).trim(); store(); }
    pend='';
  }
  if(rec){ try{ rec.onresult=null; rec.onend=null; rec.stop(); }catch(e){} rec=null; }
  if(cur){ ui(cur,false); const h=document.getElementById('h_'+cur); if(h) h.textContent=''; }
}
function ui(k,v){
  const b=document.getElementById('b_'+k); if(!b) return;
  b.classList.toggle('on',v);
  const l=document.getElementById('l_'+k); if(l) l.textContent = v?'Detener':'Hablar en vez de escribir';
  const p=document.getElementById('p_'+k); if(p) p.hidden=!v;
  document.getElementById('f_'+k)?.classList.toggle('act',v);
  if(!v) say(k,'');
}
function say(k,txt,w){ const s=document.getElementById('s_'+k); if(!s) return; s.textContent=txt||''; s.classList.toggle('warn',!!w); }

/* ======================= envío ======================= */
function payload(){
  const p={ enviado:new Date().toISOString(),
            nombre:(data.nombre||'').trim(), cargo:(data.cargo||'').trim(), funcion:(data.funcion||'').trim() };
  ASKS.forEach(a=> p[a.k]=(data[a.k]||'').trim());
  return p;
}
async function send(){
  stopRec();
  const p=payload();
  if(!ENDPOINT){ i=FLOW.length-1; render(); return; }
  const btn=stage.querySelector('.btn'); btn.disabled=true; warn('Enviando...');
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
    const j=await r.json();
    if(!r.ok||j.ok!==true) throw new Error(j.error||('HTTP '+r.status));
    try{ localStorage.removeItem(KEY); }catch(e){}
    i=FLOW.length-1; render();
  }catch(e){
    btn.disabled=false;
    warn('No se pudo enviar. Revisa tu conexión e inténtalo otra vez. Lo que escribiste sigue guardado.');
    console.error(e);
  }
}
function finish(){ const o=document.getElementById('out'); if(o) o.textContent=JSON.stringify(payload(),null,2); }

/* ======================= arranque ======================= */
window.addEventListener('beforeunload',store);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopRec(); store(); }});
render();
</script>
</body>
</html>
